
name: KalamEKHUDA

options:
  bundleIdPrefix: com.zarnosh
  deploymentTarget:
    iOS: "16.0"

targets:
  KalamEKHUDA:
    type: application
    platform: iOS

    sources:
      - KalamEKHUDAApp.swift

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zarnosh.kalamekhuda
        PRODUCT_NAME: "Kalam-e-Khuda"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "Kalam-e-Khuda"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
