
      - name: Build iOS app
        run: |
          echo "Generated Xcode projects:"
          find . -name '*.xcodeproj' -print

          PROJECT_PATH="$(find . -name '*.xcodeproj' -print -quit)"

          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: No Xcode project was generated."
            exit 1
          fi

          echo "Using project: $PROJECT_PATH"
          xcodebuild -list -project "$PROJECT_PATH"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme KalamEKHUDA \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
