
      - name: Find and build project
        run: |
          xcodegen generate --spec project.yml

          PROJECT_PATH="KalamEKHUDA.xcodeproj"

          if [ ! -d "$PROJECT_PATH" ]; then
            echo "ERROR: Expected project not found: $PROJECT_PATH"
            find . -maxdepth 3 -name '*.xcodeproj' -print
            exit 1
          fi

          xcodebuild -list -project "$PROJECT_PATH"

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme KalamEKHUDA \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
